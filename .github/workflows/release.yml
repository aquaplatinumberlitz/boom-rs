# Build phát hành 3 OS (V1-036 phần 1, issue #102; phần 2: license + font, issue #119).
#
# Chạy tay (workflow_dispatch) hoặc khi đẩy tag `v*`. Mỗi OS ra một artifact: gói gồm
# bin/, data/rules/, data/l10n/, assets/fonts/ (font OFL), README chạy nhanh và LICENSES
# (toàn văn license SPDX + bản quyền từng crate).
# KHÔNG kèm pack/bundle/asset game — người dùng tự dựng bundle từ pack của mình.
# Bố cục gói và cách chạy: docs/specification/RELEASE.md.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản đóng gói (ví dụ 0.1.0; để trống = dev)"
        required: false
        default: "dev"
        type: string
      native_gui:
        description: "Đo cửa sổ/framebuffer thật 1x/2x (không focus/minHW/G6); lỗi giữ nguyên, không retry"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Python đọc/ghi UTF-8 trên mọi OS (Windows mặc định cp1252).
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  # Cổng bàn giao (AGENTS §7) trước khi đóng gói: không đóng gói từ cây chưa xanh.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validator tiến độ kiểm commit bằng chứng/tích hợp có trong lịch sử (kr_tracking.check_commit).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      # boom-client (macroquad, ADR 0010) cần thư viện hệ thống khi build trên Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo xtask ci
      # Tự kiểm công cụ đóng gói (V1-036 phần 2): tool phải bắt được file cấm.
      - name: Tự kiểm công cụ đóng gói
        run: python tools/check_package.py test

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            archive: tar.gz
          - os: windows-latest
            os_name: windows
            arch: x86_64
            archive: zip
          - os: macos-latest
            os_name: macos
            arch: aarch64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Validator tiến độ kiểm commit bằng chứng/tích hợp có trong lịch sử (kr_tracking.check_commit).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Chọn phiên bản
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo build --release -p boom-client -p boom-server -p boom-assets

      - name: Gom gói
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="boom-rs-${VERSION}-${OS_NAME}-${ARCH}"
          export NAME
          export PKG="dist/${NAME}"
          rm -rf dist
          mkdir -p dist
          # Bố cục gói theo docs/specification/RELEASE.md §2 (một nguồn chuẩn):
          # bin/, data/rules/, data/l10n/, assets/fonts/ và README trích từ §8.
          python tools/check_package.py pack --bin-dir target/release --out "${PKG}"
          test -s "${PKG}/README.md" || { echo "LỖI: không trích được README"; exit 1; }
          echo "Gói: ${PKG}"

      # `cargo build` chỉ tải nguồn crate của nền tảng đang build; `cargo fetch` (không
      # --target) tải nguồn cho **mọi** nền tảng để LICENSES có toàn văn license của
      # toàn bộ đồ thị phụ thuộc.
      - name: Tải nguồn crate mọi nền tảng
        run: cargo fetch

      - name: Sinh LICENSES
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="boom-rs-${VERSION}-${OS_NAME}-${ARCH}"
          export NAME
          export PKG="dist/${NAME}"
          python tools/check_package.py licenses --out "${PKG}/LICENSES"
          test -s "${PKG}/LICENSES" || { echo "LỖI: LICENSES rỗng"; exit 1; }

      # Chặn pack/bundle/asset game trong gói và kiểm thành phần bắt buộc.
      - name: Kiểm bộ đóng gói
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="boom-rs-${VERSION}-${OS_NAME}-${ARCH}"
          export NAME
          export PKG="dist/${NAME}"
          python tools/check_package.py check "${PKG}"

      - name: Đóng gói
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          NAME="boom-rs-${VERSION}-${OS_NAME}-${ARCH}"
          export NAME
          cd dist
          python - <<'PY'
          import os, shutil
          name = os.environ["NAME"]
          fmt = "zip" if os.environ["ARCHIVE"] == "zip" else "gztar"
          shutil.make_archive(name, fmt, root_dir=".", base_dir=name)
          PY
          ls -l

      # Mở **archive đã đóng** rồi chạy binary trong đó (V1-036): bằng chứng gói
      # cài/chạy được trên OS này, không chỉ thư mục dựng tạm. Log (version +
      # fingerprint + từng ca) lưu thành artifact.
      - name: Mở gói và smoke
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          NAME="boom-rs-${VERSION}-${OS_NAME}-${ARCH}"
          export NAME
          rm -rf dist/smoke
          mkdir -p dist/smoke
          python tools/check_package.py unpack "dist/${NAME}.${ARCHIVE}" --out dist/smoke
          # Gói đã mở phải đạt kiểm thành phần (đủ file, không pack/asset game).
          python tools/check_package.py check "dist/smoke/${NAME}"
          # Chạy binary trong gói: content/health --offline, client --help, và các
          # ca thiếu pack/rules/l10n phải báo lỗi rõ (đường dẫn + cách sửa).
          python tools/check_package.py smoke "dist/smoke/${NAME}" \
            --log "dist/smoke-log.txt" --version "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boom-rs-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/boom-rs-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - name: Upload log smoke
        # Log smoke là thứ duy nhất còn lại khi gói lỗi trên một OS ⇒ upload **cả
        # khi job fail**. Điều kiện mặc định của GitHub là `success()` nên bước này
        # bị bỏ qua khi smoke trả mã khác 0 (review #168 vòng 1).
        if: ${{ !cancelled() && hashFiles('dist/smoke-log.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: boom-rs-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}-smoke
          path: dist/smoke-log.txt
          if-no-files-found: error

      # Diagnostic opt-in: archives/smoke logs above are preserved even if a runner
      # cannot create a native context. Failure is an observation, never a G6 pass.
      - name: Native GUI window probe (Linux software GL)
        timeout-minutes: 3
        if: ${{ inputs.native_gui && runner.os == 'Linux' }}
        env:
          BOOM_QA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          PKG="dist/smoke/boom-rs-${BOOM_QA_VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          xvfb-run -a -s "-screen 0 1920x1440x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            python tools/gui_probe.py --package "$PKG" --out dist/gui-probe.json

      - name: Native GUI window probe (Windows/macOS observed context)
        timeout-minutes: 2
        if: ${{ inputs.native_gui && runner.os != 'Linux' }}
        env:
          BOOM_QA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="dist/smoke/boom-rs-${BOOM_QA_VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          python tools/gui_probe.py --package "$PKG" --out dist/gui-probe.json

      - name: Upload native GUI observations (JSON only)
        if: ${{ !cancelled() && inputs.native_gui && hashFiles('dist/gui-probe.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: boom-rs-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}-gui
          path: dist/gui-probe.json
          if-no-files-found: error
