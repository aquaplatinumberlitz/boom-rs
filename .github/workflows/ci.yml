# CI hiện chỉ chạy Linux theo chỉ đạo chủ dự án 2026-10-26.
# Windows/macOS tạm hoãn; nghiệm thu đa nền tảng trong SCOPE_V1 vẫn để sau.
# Toolchain lấy từ rust-toolchain.toml. Cần remote GitHub để chạy (ADR 0003).
#
# Job `smoke` (V1-036): dựng gói trên từng OS, chạy binary trong gói và kiểm lỗi
# thiếu file báo rõ; log (version + fingerprint) lưu thành artifact.
name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Python đọc/ghi UTF-8 trên mọi OS (Windows mặc định cp1252).
  PYTHONUTF8: "1"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Validator tiến độ kiểm commit bằng chứng/tích hợp có trong lịch sử (kr_tracking.check_commit).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      # boom-client (macroquad, ADR 0010) cần thư viện hệ thống khi build trên Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo xtask ci
      # Tự kiểm công cụ đóng gói (V1-036): bộ test của `tools/check_package.py` phải
      # xanh trên **mọi** PR — nếu không, regression của smoke chỉ lộ lúc phát hành
      # (job `check` của `release.yml` chỉ chạy khi workflow_dispatch hoặc đẩy tag).
      # Giữ đầy đủ bộ kiểm đóng gói trên Linux trong thời gian hoãn Windows/macOS.
      - name: Tự kiểm công cụ đóng gói
        run: python tools/check_package.py test

  # Smoke cài/chạy gói (V1-036): build binary trên OS này → dựng gói → chạy binary
  # trong gói (server content/health --offline, client --help) và kiểm các ca thiếu
  # pack/rules/l10n đều báo lỗi rõ. Log lưu artifact kèm version + fingerprint.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      # Build debug: smoke kiểm binary **chạy được** trên OS này; bản phát hành
      # (`release.yml`) build --release và mở đúng archive đã đóng.
      - name: Build binary
        run: cargo build -p boom-client -p boom-server -p boom-assets
      - name: Gom gói
        run: python tools/check_package.py pack --bin-dir target/debug --out dist/boom-rs-smoke
      - name: "Smoke: chạy binary trong gói"
        run: >
          python tools/check_package.py smoke dist/boom-rs-smoke
          --log dist/smoke-log.txt --version dev
      - name: Upload log smoke
        # Log smoke là thứ duy nhất còn lại khi gói lỗi trên một OS ⇒ upload **cả
        # khi job fail**. Điều kiện mặc định của GitHub là `success()` nên bước này
        # bị bỏ qua khi smoke trả mã khác 0 (review #168 vòng 1).
        if: ${{ !cancelled() && hashFiles('dist/smoke-log.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}
          path: dist/smoke-log.txt
          if-no-files-found: error
