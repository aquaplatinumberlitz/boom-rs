[workspace]
resolver = "3"
exclude = ["vendor/miniquad"]
members = [
    "crates/boom-core",
    "crates/boom-content",
    "crates/boom-assets",
    "crates/boom-replay",
    "crates/boom-proto",
    "crates/boom-net",
    "crates/boom-sync",
    "crates/boom-server",
    "crates/boom-client",
    "crates/boom-room",
    "crates/boom-scenario",
    "crates/boom-qa",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
boom-core = { path = "crates/boom-core" }
boom-content = { path = "crates/boom-content" }
boom-assets = { path = "crates/boom-assets" }
boom-scenario = { path = "crates/boom-scenario" }
serde = { version = "1", features = ["derive"] }
toml = "1"
# Identity/persistence/log của boom-server (ADR 0011 §10). Không dùng `rand` (ADR 0011 §6).
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
fs4 = "1.1.0"
serde_json = "1.0.154"
# SHA-256 của token thô và mã hóa base64url không padding (ADR 0011 §6).
sha2 = "0.11.1"
base64 = "0.23.1"
# Test SQLite thật trên file tạm (ADR 0011 §10).
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tràn số trong mô phỏng phải dừng ngay, không wrap âm thầm (ADR 0004).
[profile.release]
overflow-checks = true

# Issue270: pin existing miniquad with a scoped X11/EWMH fix; see vendor/miniquad/UPSTREAM.json.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
