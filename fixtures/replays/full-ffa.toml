# Một vòng FFA 2 người trên map ASCII nhỏ, cố ý dùng prestate để chạm đủ pipeline:
# - tick 0: player 0 đặt bom rồi đi lên khỏi tầm nổ;
# - tick 80: bom (3,1) nổ, chain qua (3,2) rồi (4,2)…(6,2), phá ba khối mềm ở hàng 1;
# - player 0 lên hàng 1, nhặt Bomb/Fire/Roller rồi xuống chạm người bị nhốt;
# - player 1 bị lửa ở (7,3) nhốt, chết khi player 0 chạm, player 0 thắng.
# Input viết tay theo chủ ý; golden chỉ là regression (AGENTS §4), không phải oracle bản gốc.
schema = 1
hash_algo = "fnv1a64-v0"
content_sha256 = "278af9a907d0be57360206094c46a9ff80bcf2889b9bdc9497382cbdcb874f48"
ticks = 300
checkpoints = [1, 20, 29, 80, 130, 180, 220, 260, 280]
rules = "../rules/skeleton-test.toml"
profile_hash = "0x63d7e6b1c69d1354"
mode = "battle_ffa"
seed = 42
map = [
    "#########",
    "#...+++.#",
    "#.......#",
    "#0.....1#",
    "#########",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [1, 3]

[[player]]
id = 1
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [7, 3]

# Bom mồi: nổ trước, chain qua các bom hàng dưới để phá ba khối mềm.
[[bomb]]
cell = [3, 1]
owner = 1
range = 1
fuse = 80

[[bomb]]
cell = [3, 2]
owner = 1
range = 1
fuse = 1000

[[bomb]]
cell = [4, 2]
owner = 1
range = 1
fuse = 1000

[[bomb]]
cell = [5, 2]
owner = 1
range = 1
fuse = 1000

[[bomb]]
cell = [6, 2]
owner = 1
range = 1
fuse = 1000

[[hidden]]
cell = [4, 1]
kind = "Bomb"

[[hidden]]
cell = [5, 1]
kind = "Fire"

[[hidden]]
cell = [6, 1]
kind = "Roller"

# Player 1 bị nhốt từ tick 0; player 0 tới chạm ở tick 284.
[[flame]]
cell = [7, 3]
ticks = 5
owner = 0

# Ý định: đặt bom tại chỗ rồi đi lên khỏi tầm nổ; player 1 bị lửa nhốt cùng tick.
[[input]]
tick = 0
player = 0
dir = "up"
bomb = true

# Ý định: đợi lửa tắt rồi đi ngang hàng 1, nhặt Bomb/Fire/Roller đã lộ.
[[input]]
tick = 130
player = 0
dir = "right"


# Ý định: xuống hàng 3 tại cột 7, chạm người bị nhốt để kết thúc thắng.
[[input]]
tick = 260
player = 0
dir = "down"
