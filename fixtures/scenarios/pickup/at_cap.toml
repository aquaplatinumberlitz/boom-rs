# Ca biên: chỉ số đã ở trần thì không nhặt — item vẫn nằm trên nền, không áp hiệu ứng và
# không phát event (R-058). Nhặt là atomic: item chỉ mất khi hiệu ứng áp được (SCOPE_V1 §4).
name = "Đã chạm trần thì item ở lại trên nền, không nhặt"
features = ["V1-017"]
claims = ["R-025", "R-058"]
status = "active"
ticks = 20
map = [
    "#######",
    "#0....#",
    "#######",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [3, 3]
range = [1, 7]

[[item]]
cell = [2, 1]
kind = "Bomb"

[[input]]
tick = 0
player = 0
dir = "right"

# Người chơi bước vào ô (2,1) ở tick 10; số bom đã ở trần nên không có event nhặt.
[[expect]]
tick = 10
event = "item_picked"
count = 0

[[expect]]
tick = 20
player = 0
bombs = 3

[[expect]]
tick = 20
item_count = 1

[[expect]]
tick = 20
at = [2, 1]
item = "Bomb"
