# Không cần system explosion: ô bị vụ nổ phủ dựng sẵn trên khối mềm có item giấu.
# BnB phá gạch lúc nổ (game.js:401–431), tức trước bước giảm TTL, nên phá gạch không phụ
# thuộc tuổi lửa.
name = "Ô bị vụ nổ phủ phá khối mềm và lộ item giấu, một lần"
features = ["V1-016"]
claims = ["R-030", "R-050", "R-067"]
status = "active"
ticks = 3
map = [
    "#####",
    "#0+.#",
    "#####",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]

[[blast]]
cell = [2, 1]

[[hidden]]
cell = [2, 1]
kind = "Roller"

[[expect]]
tick = 1
event = "block_destroyed"
where = { x = 2, y = 1 }
count = 1

[[expect]]
tick = 1
event = "item_revealed"
where = { x = 2, y = 1, kind = 2 }
count = 1

[[expect]]
tick = 2
event = "block_destroyed"
count = 0

[[expect]]
tick = 2
at = [2, 1]
kind = "floor"
item = "Roller"
