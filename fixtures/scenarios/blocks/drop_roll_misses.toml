# Khối mềm vỡ nhưng lần rút xác suất **trượt** nên không rơi item nào (R-106, R-112).
# Xác suất lấy từ profile: `drop.brick_item_chance` = 350‰.
#
# seed 1: lần rút đầu của RNG ra 465‰ ≥ 350‰ nên khối vỡ không rơi item.
name = "Khối mềm vỡ mà lần rút trượt thì không rơi item"
features = ["V1-016"]
claims = ["R-106", "R-112"]
status = "active"
seed = 1
ticks = 3
map = [
    "#####",
    "#0+.#",
    "#####",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
