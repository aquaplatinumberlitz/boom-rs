[[blast]]
cell = [2, 1]

[[expect]]
tick = 1
event = "block_destroyed"
where = { x = 2, y = 1 }
count = 1

[[expect]]
tick = 1
event = "item_revealed"
count = 0

[[expect]]
tick = 1
at = [2, 1]
kind = "floor"
item = "none"

[[expect]]
tick = 1
item_count = 0
