# Bom (1,1) tầm 3 gặp khối mềm (2,1): ô đó có lửa rồi lửa dừng, không tới bom (3,1).
# Khối mềm bị lửa phá trong cùng tick (V1-016, R-030); bom phía sau vẫn còn và không nổ.
name = "Lửa dừng ở khối mềm, bom phía sau không nổ"
features = ["V1-014", "V1-015"]
claims = ["R-030", "R-033"]
status = "active"
ticks = 12
map = [
    "#######",
    "#.+...#",
    "#.....#",
    "#######",
]

[[player]]
id = 0
speed = [5, 7]
