# Biên TTL hai tick: lửa sống **đúng một tick** — BnB sinh vụ nổ với ttl = 2 rồi giảm TTL ngay
# trong tick nổ (`server/game.js:448–451`) nên ttl 2 → 1: lửa còn ở tick nổ (và nhốt người đứng
# trong lửa ở đúng tick đó), hết ở tick kế tiếp.
name = "flame_ticks = 2: lửa sống đúng một tick, chỉ nhốt ở tick nổ"
features = ["V1-014", "V1-015", "V1-020"]
claims = ["R-023", "R-030", "R-033", "R-109"]
status = "active"
ticks = 4
overlays = ["../../rules/flame-ttl-two.toml"]
map = [
    "#######",
    "#0..+.#",
    "#######",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [1, 1]

[[bomb]]
cell = [2, 1]
owner = 0
range = 1
fuse = 0

[[expect]]
tick = 1
event = "bomb_exploded"
where = { x = 2, y = 1, chained = 0 }
count = 1

# Tick nổ: lửa còn sống (`until` = tick nổ) nên người đứng trong lửa bị nhốt.
[[expect]]
tick = 1
event = "player_trapped"
where = { player = 0 }
count = 1

[[expect]]
tick = 1
at = [1, 1]
flame = true

[[expect]]
tick = 1
at = [2, 1]
flame = true

[[expect]]
tick = 1
at = [3, 1]
flame = true
kind = "floor"

[[expect]]
tick = 1
player = 0
life = "trapped"

# Tick sau: ttl 1 → 0 nên vụ nổ bị xóa, không còn ô lửa (người bị nhốt vẫn đếm timer).
[[expect]]
tick = 2
at = [1, 1]
flame = false

[[expect]]
tick = 2
at = [2, 1]
flame = false

[[expect]]
tick = 2
at = [3, 1]
flame = false

[[expect]]
tick = 2
player = 0
life = "trapped"

[[expect]]
tick = 2
event = "player_trapped"
count = 0
