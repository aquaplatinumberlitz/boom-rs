# Hai bom cùng explodes_at = 10 nổ trong tick 11; tầm 2 từ (1,1) và (3,1) chồng nhau ở (2,1).
# Mỗi ô vẫn chỉ một flame (bất biến state kiểm sau tick); source chọn theo R-033, unit test giữ.
name = "Hai bom nổ cùng tick, lửa chồng nhau giữ một flame mỗi ô"
features = ["V1-014", "V1-015"]
claims = ["R-030", "R-033"]
status = "active"
ticks = 12
map = [
    "#######",
    "#.....#",
    "#.....#",
    "#######",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [4, 2]

[[bomb]]
cell = [1, 1]
owner = 0
range = 2
fuse = 10

[[bomb]]
cell = [3, 1]
owner = 0
range = 2
fuse = 10

[[expect]]
tick = 11
event = "bomb_exploded"
count = 2

[[expect]]
tick = 11
event = "bomb_exploded"
where = { x = 1, y = 1, chained = 0 }
count = 1

[[expect]]
tick = 11
event = "bomb_exploded"
where = { x = 3, y = 1, chained = 0 }
count = 1

[[expect]]
tick = 11
bomb_count = 0

[[expect]]
tick = 11
at = [1, 1]
flame = true

[[expect]]
tick = 11
at = [2, 1]
flame = true

[[expect]]
tick = 11
at = [3, 1]
flame = true

[[expect]]
tick = 11
at = [5, 1]
flame = true

[[expect]]
tick = 11
at = [0, 1]
flame = false
