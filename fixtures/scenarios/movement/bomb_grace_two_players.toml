# R-107: `grace` (pass) cấp cho mọi người có hộp chồng ô bom lúc đặt, và bị xóa khi hộp rời
# hẳn ô bom. Hai người cùng đứng trên bom vừa đặt đều đi ra được; rời hẳn ô xong thì bom chặn
# người đó không quay lại được (BnB `server/game.js:150–153,392–399`).
#
# Bom ở ô (2,1) (80…120 px). Người 0 đi sang phải thì hộp rời hẳn ô bom khi x ≥ 134 px; người 1
# đi sang trái thì rời ô bom khi x ≤ 66 px. Từ đó bom chặn cả hai theo mép hộp.
name = "Hai người cùng đứng trên bom vừa đặt đều đi ra được, sau đó không quay lại"
features = ["V1-012"]
claims = ["R-049", "R-107"]
status = "active"
ticks = 160
map = [
    "#######",
    "#01...#",
    "#######",
]

[[player]]
id = 0
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [2, 1]

[[player]]
id = 1
speed = [5, 7]
bombs = [1, 10]
range = [1, 7]
cell = [2, 1]

[[bomb]]
cell = [2, 1]
owner = 0
range = 1
fuse = 1000
grace = [0, 1]

[[input]]
tick = 0
player = 0
dir = "right"

[[input]]
tick = 0
player = 1
dir = "left"

# Cả hai đã rời hẳn ô bom (2,1): grace bị xóa khi hộp rời ô.
[[expect]]
tick = 80
player = 0
pos_mpx = [226000, 60000]

[[expect]]
tick = 80
player = 1
pos_mpx = [54000, 60000]

[[input]]
tick = 80
player = 0
dir = "left"

[[input]]
tick = 80
player = 1
dir = "right"

# Người 0 quay lại bị bom chặn ở mép hộp x = 134 px; người 1 quay lại bị bom chặn ở x = 66 px.
[[expect]]
tick = 160
player = 0
pos_mpx = [134000, 60000]

[[expect]]
tick = 160
player = 1
pos_mpx = [66000, 60000]
