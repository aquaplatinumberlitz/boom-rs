# Chỉ số nhân vật C00/C01: `BomberAttr` của pack KR 00967 (RULES_V1 R-040/R-041, `confirmed`).
# Nghĩa trường theo R-042 (`candidate`): f2–f3 = cấp tốc độ, f4–f5 = số bom, f6–f7 = tầm nổ.
# Vì nghĩa trường còn `candidate`, **giá trị dùng** cũng là `candidate` (AGENTS §4): dãy số đã
# đối chiếu (R-040/R-041) nhưng chưa có bằng chứng rằng f2–f7 mang đúng nghĩa speed/bombs/range.
# Mỗi giá trị là một khóa riêng để mỗi giá trị trỏ claim (AGENTS §3) và để `rules_hash`
# đổi khi chỉ số đổi (định danh profile là hash của toàn bộ rule).
