# Bảng asset UI của luồng V1: màn hình → phần tử → entry pack.
#
# Nguồn chuẩn duy nhất cho bảng UI của V1 (trước đây là khai báo Rust trong
# `crates/boom-assets/src/closure.rs`). Sửa mapping = sửa file này, không sửa code.
#
# Cột nhãn (AGENTS §4):
# - `source`: nguồn của **asset** được trỏ tới (`kr_static`: entry có thật trong pack KR
#   00967; `design`: V1 không dùng asset nào cho phần tử này).
# - `status`: mức bằng chứng của asset đó (`confirmed`: entry có thật và payload đọc được;
#   `design`: quyết định của dự án — vẽ text/màu theo `reason`).
# - `state`: trạng thái **dùng** của phần tử (không phải nhãn bằng chứng):
#   `selected` (có trong closure V1 và không có chữ cần duyệt), `needs_review_text`
#   (có chữ, chờ duyệt ảnh), `excluded` (không dùng asset này).
# - `reason`: bắt buộc, không rỗng — lý do/ghi chú để client biết phải vẽ gì thay.
# - `claims`: phần tử UI **không phải luật chơi** nên không có claim RULES_V1
#   (BUNDLES §3.3) ⇒ `claims = []`; quyết định dùng được truy bằng `state` + `reason`.
#
# Phần tử `selected`/`needs_review_text` phải có `entry`; phần tử `excluded` không bắt buộc
# có entry (V1 dựng bằng màu, chữ lấy từ catalog).
#
# Nguồn: UI_STRINGS_V1 §3 (danh mục ảnh có chữ của luồng V1), ảnh giải mã đọc trực tiếp từ
# pack KR 00967 ngày 2026-10-20, IMAGE_REVIEW (quy trình duyệt ảnh).

