# Bảng closure của một trận V1: entry pack cần có + vai trò + họ sprite nhân vật.
#
# Nguồn chuẩn duy nhất cho phần "entry cố định" và "họ entry nhân vật" của closure V1
# (trước đây là khai báo Rust trong `crates/boom-assets/src/closure.rs`). Sửa mapping =
# sửa file này, không sửa code.
#
# Cột nhãn (AGENTS §4):
# - `source`: nguồn của **entry** được trỏ tới (`kr_static`: đọc từ pack KR 00967).
# - `status`: mức bằng chứng của vai trò:
#   `confirmed` (tên entry và dãi frame đọc được trong pack), `candidate` (entry có trong
#   pack nhưng chưa có consumer nào xác nhận state nào dùng nó), `design` (mapping state V1
#   → clip là quyết định của V1 — R-086).
# - `claims`: claim RULES_V1 của dòng; `note`: lý do, giới hạn.
#
# Entry theme, preview và BGM **không** khai ở đây: chúng suy từ quy tắc tra theme
# (R-071 `candidate`; riêng map V1 `Village00` đã xác nhận ở R-070).
#
# `[[character_families]]`: họ entry sprite nhân vật — **tiền tố** entry trong ODT
# (`Character/<Id>-<họ>`); entry pack đầy đủ là `Character/<Id>-<họ>Layer<lớp>` vì client
# ghép thêm lớp `Static`/`Adjust` (R-094). `used_by_v1 = true` ⇒ closure kiểm họ đó có
# trong bảng state của client trong ODT lúc dựng manifest.
#
# `[[character_states]]`: mapping state của V1 → state của client (ODT) → họ entry mà V1
# chọn. Bảng ODT xác nhận **nhãn → entry**; nó **không** xác nhận state core V1 dùng nhãn
# nào ⇒ dòng này là quyết định của V1 (`design`, R-086).
#
# Nguồn: RULES_V1 §1, §8, §8.2 (R-002, R-040, R-051, R-077, R-078, R-084, R-086, R-094),
# docs/evidence/inventory/kr_v1_content.json, BUNDLES §6.

