# Bảng mapping âm thanh V1: event → entry trong pack `FxSound`.
#
# Nguồn chuẩn duy nhất cho bảng audio của V1 (trước đây là khai báo Rust trong
# `crates/boom-assets/src/audio.rs`). Sửa mapping = sửa file này, không sửa code.
#
# Cột nhãn (AGENTS §4):
# - `source`: nguồn của **entry** được trỏ tới (`kr_static`: entry có thật trong pack
#   `FxSound` của build KR 00967; 15 entry V1 có SHA-256 trùng ở KR và VN — AUDIO_V1 §5).
# - `status`: mức bằng chứng của **mapping** event → entry. Phần lớn mapping chưa có
#   consumer gốc xác nhận event nào phát entry nào ⇒ là quyết định của V1 (`design`,
#   R-082). Ngoại lệ `player_trapped`: consumer solo đã xác nhận id 77 (R-203/R-204)
#   nên mapping `confirmed`. Policy voice/priority/dedup/loop vẫn là `design` R-083,
#   không được suy thành confirmed từ mapping này.
#   Riêng BGM: entry/mapping `MP3/Village` đã xác nhận (R-081), nhưng policy loop một
#   voice là `design` (R-083) ⇒ dòng này vẫn `design`.
# - `claims`: claim RULES_V1; `note`: lý do, giới hạn, ứng viên.
#
# Entry nào không chọn được thì **không** ghi dòng (giữ im lặng, theo dõi ở Q-015).
#
# Nguồn: RULES_V1 §10 (R-081…R-083) và §RE âm thanh (R-203/R-204), AUDIO_V1 §2–§5.

