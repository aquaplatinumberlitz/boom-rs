# Bảng mapping animation V1: state trình diễn → entry pack.
#
# Nguồn chuẩn duy nhất cho bảng clip của V1 (trước đây là khai báo Rust trong
# `crates/boom-assets/src/animation.rs`). Sửa mapping = sửa file này, không sửa code.
#
# Cột nhãn (AGENTS §4):
# - `source`: nguồn của **entry** được trỏ tới (`kr_static`: đọc từ pack KR 00967).
# - `status`: mức bằng chứng của **mapping** state → entry:
#   `confirmed` (R-077/R-084: tên entry và dãi frame đọc được trong pack KR 00967),
#   `candidate` (R-078: entry có trong pack nhưng chưa có consumer nào xác nhận state nào
#   dùng nó — Q-003).
# - `claims`: claim RULES_V1 của dòng; `note`: lý do, giới hạn, ứng viên.
#
# Thứ tự dòng **có ý nghĩa**: thứ tự clip trong bundle quyết định thứ tự atlas, nên
# `content_hash` đổi khi thêm/bớt một dòng.
#
# `timing` của clip: không ghi thì dùng `default_timing` của bảng. R-079: pack client gốc
# không mang trường thời lượng frame nên V1 chưa chốt được ⇒ `unknown` (không mang số).
# Khi có nguồn thời lượng thì ghi `timing = { known = { ms = …, source = …, status = …,
# claims = […] } }` riêng cho clip đó — `unknown` không được mang giá trị.
#
# Nguồn: RULES_V1 §8 (R-077…R-079, R-084), MAPS §3, pack KR 00967.

schema = 1
default_timing = { unknown = { reason = "pack client gốc không mang trường thời lượng frame (blob CDataI16Alpha v2 chỉ có 12 số mỗi frame, MAPS §3) và consumer phía client chưa định vị được; V1 chưa chốt thời lượng nên không tự đặt (R-079, Q-003)" } }

