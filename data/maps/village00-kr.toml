# Bảng phân loại ô của theme Village, dùng cho map Village00 bản KR 00967 (V1-030, Q-002).
#
# Nguồn dữ liệu (không chép pack vào repo):
# - `fx/ObjectTable/ObjectTable` của pack KR: obj ID trong file `.map` là chỉ số entry của bảng này.
#   Tên entry cho biết theme/lớp, ví dụ `Tile00_Static/Tree00` (KR index 1958; VN index 1020).
# - `fx/TileInfo/TileInfoList` của pack KR: mỗi tile có `Data` 72 byte; word đầu là lớp runtime
#   0 = Ground, 1 = Static/Event, 2 = Box, 3 = Passable (đã đối chiếu toàn bộ 5.929 entry).
# - Đối chiếu VN: cùng tên tile/obj, obj ID KR = VN + 937/+938 (RULES_V1 R-004).
# - Va chạm: client VN runtime không đi được vì ô spawn bị chặn bởi viền/cây/gạch, phải đặt bom
#   (`/home/admin/boom-re/docs/oc_e-game.md` §5a-3); gạch vỡ do client báo C→S 135 (§5a-5d, R-008).
#
# `empty` là loại của ô không có obj (`-1`). Ô chỉ có tile nền Ground/Passable là Floor.
schema = 1
profile_id = "kr-village00-map-r1"
map = "Village00"
build = "kr"
width = 15
height = 13
source = "kr_static"
status = "confirmed"

empty = "floor"

[classes]
# Lớp lấy từ tiền tố `Tile00_<lớp>/<tên>` trong ObjectTable và word đầu của TileInfo.
ground = "floor"    # CGOTileGround: nền
passable = "floor"  # CGOTilePassable: trang trí đi qua được
static = "solid"    # CGOTileStatic/Fixed: vật cản
box = "breakable"   # CGOTileFixedBox: gạch phá được, chỗ giấu item (R-008)
event = "solid"     # TileInfo Data[0] = 1 như Static; Village00 không dùng obj Event

# Tile nền đã biết của theme (kiểm để không bỏ qua ID lạ một cách âm thầm).
