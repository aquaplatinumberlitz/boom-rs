[package]
name = "boom-client"
description = "Client V1 trên macroquad (ADR 0010): input/scale/focus, scene, presentation journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
boom-core.workspace = true
boom-content.workspace = true
boom-proto = { path = "../boom-proto" }
boom-net = { path = "../boom-net" }
boom-sync = { path = "../boom-sync" }
macroquad = { version = "=0.4.16", features = ["audio"] }
# Tùy chọn client `options.toml` (ADR 0011 §7): đọc/ghi TOML + derive serde.
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Test end-to-end headless: client mạng đối diện `boom-server` qua `MemoryTransport`
# (ADR 0005/0009). `boom-room` cần cho API phòng của server khi dựng lượt.
boom-server = { path = "../boom-server" }
boom-room = { path = "../boom-room" }
# Auth thật trong test: SQLite trên file tạm (ADR 0011 §10).
tempfile.workspace = true

[lints]
workspace = true
