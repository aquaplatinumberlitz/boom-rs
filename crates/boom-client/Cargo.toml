[package]
name = "boom-client"
description = "Client V1 trên macroquad (ADR 0010): input/scale/focus, scene, presentation journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
boom-core.workspace = true
boom-content.workspace = true
boom-proto = { path = "../boom-proto" }
boom-net = { path = "../boom-net" }
boom-sync = { path = "../boom-sync" }
macroquad = { version = "=0.4.16", features = ["audio"] }
# Font client (V1-035): metric TTF thật để đo/wrap chữ không cần GPU.
ab_glyph = "0.2.32"
# Cắt chuỗi theo cụm chữ (grapheme cluster) — không cắt giữa dấu tổ hợp.
unicode-segmentation = "1.13"
# Tùy chọn client `options.toml` (ADR 0011 §7): đọc/ghi TOML + derive serde.
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Ảnh golden layout (test `#[ignore]`, chạy tay) — không nằm trên đường chạy.
png = "0.18"

[lints]
workspace = true
