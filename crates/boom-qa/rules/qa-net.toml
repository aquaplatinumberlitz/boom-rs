# Profile rules cho hồ sơ QA mạng `scope-v1` (V1-027).
#
# Đây là **profile fixture kiểm thử**, cùng loại với `fixtures/rules/skeleton-test.toml`: mọi
# rule ghi `source = "design"`, `status = "design"`, không sinh claim R-xxx và không nằm trong
# `data/rules/` (profile phát hành). Khác `skeleton-test`: round ngắn hơn để chạy nhiều hồ sơ
# trong thời gian hợp lý, và tốc độ nhân vật cao hơn để bot thực sự di chuyển trong round.
#
# `profile_id` khác `skeleton-test` ⇒ định danh profile (hash) khác; server và bot trong harness
# dùng cùng profile nên handshake vẫn khớp.
schema = 1
profile_id = "qa-net"
release = false

[sim.ticks_per_second]
value = 60
unit = "Hz"
source = "design"
status = "design"

[grid.tile_px]
value = 40
unit = "px"
source = "design"
status = "design"

[round.duration_ms]
value = 20000
unit = "ms"
source = "design"
status = "design"

[player.speed_px_per_s_per_level]
value = 120
unit = "px/s"
source = "design"
status = "design"

