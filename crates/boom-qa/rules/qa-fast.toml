# Profile rules cho hồ sơ QA nhanh (`fast`) — test CI.
#
# Cùng loại fixture với `qa-net.toml`: mọi rule `design`, không claim, không phải profile
# phát hành. Chỉ khác `round.duration_ms` để test chạy nhanh.
schema = 1
profile_id = "qa-fast"
release = false

[sim.ticks_per_second]
value = 60
unit = "Hz"
source = "design"
status = "design"

[grid.tile_px]
value = 40
unit = "px"
source = "design"
status = "design"

[round.duration_ms]
value = 2000
unit = "ms"
source = "design"
status = "design"

# Warmup đóng băng đầu lượt (R-100): hồ sơ QA chạy lượt ngắn, không đóng băng (0 ms) — cùng
# giá trị với `fixtures/rules/skeleton-test.toml`.
[round.warmup_ms]
value = 0
unit = "ms"
source = "design"
status = "design"

[player.trapped_can_move]
value = 1
unit = "bool"
source = "design"
status = "design"
claims = ["R-127", "R-132"]
note = "Fixture bật cơ chế KR R-127; các thông số còn lại của fixture không phải oracle gốc"

[player.speed_px_per_s_per_level]
value = 120
unit = "px/s"
source = "design"
status = "design"

# Cơ chế hộp va chạm và bám góc (R-107, ADR 0012): hộp 26×26 px, bám góc khi lệch ≤ 12 px.
# Giá trị giống `data/rules/v1-dev.toml` và `fixtures/rules/skeleton-test.toml` để harness
# chạy đúng cơ chế engine V1 (khác `skeleton-test` chỉ ở nhịp tick và thời lượng round).
[player.collision_half_px]
value = 13
unit = "px"
source = "design"
status = "design"

[player.corner_assist_px]
value = 12
unit = "px"
source = "design"
status = "design"

[player.trap_to_death_ms]
value = 6300
unit = "ms"
source = "design"
status = "design"

# Khoảng cách chạm làm vỡ bong bóng: mỗi trục lệch nhỏ hơn 28 px (R-108). Cùng giá trị với
